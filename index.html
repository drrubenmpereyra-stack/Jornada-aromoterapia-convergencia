<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Aula Virtual</title>
    <style>
        body {
            background-color: #12100e;
            color: #2b2b2b;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: #ffffff;
            padding: 3rem;
            border-radius: 12px;
            border: 3px solid #1d3557;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #b5838d;
            margin-bottom: 1rem;
            object-fit: cover;
        }
        .btn-custom {
            background-color: #b5838d !important;
            color: #ffffff !important;
            border: 2px solid #1d3557 !important;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-custom:hover {
            border-color: #ffb703 !important;
            box-shadow: 0 0 18px #ffb703 !important;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="Logotipo.jpg" alt="Logo" class="login-logo">
        <h2 style="color: #1d3557; margin-bottom: 1rem;">Prueba de Estilos</h2>
        <button class="btn-custom">Botón Lavanda</button>
    </div>
</body>
</html>
